    <g transform="rotate(20 104 47)"><rect x="99" y="38" width="10" height="18" rx="2" fill="#e5484d" stroke="#8f2228" stroke-width="1.5"/><rect x="99" y="44" width="10" height="5" fill="#fff" opacity=".8"/></g>
    <g><circle cx="56" cy="50" r="7" fill="#f6f5ef" stroke="#a9a89c" stroke-width="1.5"/>
    <path d="M52.5 48.6 l2.8000000000000003 2.1 l2.1 -3.5 M54.6 53.15 l3.5 -0.7000000000000001" fill="none" stroke="#b9b8ac" stroke-width="1.2" stroke-linecap="round"/></g>
    <g><circle cx="66" cy="52" r="8" fill="#f6f5ef" stroke="#a9a89c" stroke-width="1.5"/>
    <path d="M62 50.4 l3.2 2.4 l2.4 -4 M64.4 55.6 l4 -0.8" fill="none" stroke="#b9b8ac" stroke-width="1.2" stroke-linecap="round"/></g>
