    <path d="M91.5 51.6 l2.8000000000000003 2.1 l2.1 -3.5 M93.6 56.15 l3.5 -0.7000000000000001" fill="none" stroke="#b9b8ac" stroke-width="1.2" stroke-linecap="round"/></g>
    <g transform="translate(0 -18) rotate(-4 80 51)"><g class="lid">
      <path d="M40 48 Q80 30 120 48 Z" fill="#6fe0b4" stroke="#1d6b4f" stroke-width="3" stroke-linejoin="round"/>
      <rect x="72" y="33" width="16" height="6" rx="3" fill="#6fe0b4" stroke="#1d6b4f" stroke-width="2.5"/>
      <rect x="34" y="46" width="92" height="10" rx="5" fill="#6fe0b4" stroke="#1d6b4f" stroke-width="3"/>
    </g></g>
    <path d="M57 96 Q66 85 75 96" fill="none" stroke="#173b2e" stroke-width="4" stroke-linecap="round"/><path d="M85 96 Q94 85 103 96" fill="none" stroke="#173b2e" stroke-width="4" stroke-linecap="round"/><path d="M66 112 Q80 132 94 112 Z" fill="#173b2e" stroke="#173b2e" stroke-width="3" stroke-linejoin="round"/><ellipse cx="80" cy="124" rx="7" ry="3.5" fill="#ff6f91"/><ellipse cx="55" cy="107" rx="6" ry="3.5" fill="#ff8fb1" opacity="0.85"/><ellipse cx="105" cy="107" rx="6" ry="3.5" fill="#ff8fb1" opacity="0.85"/>
  </g>
  <path class="heart h1" d="M18 40 c0 -6 8 -6 8 0 c0 -6 8 -6 8 0 c0 6 -8 10 -8 12 c0 -2 -8 -6 -8 -12z" fill="#ff5c8a"/>
  <path class="heart h2" d="M128 50 c0 -5 7 -5 7 0 c0 -5 7 -5 7 0 c0 5 -7 9 -7 11 c0 -2 -7 -6 -7 -11z" fill="#ff5c8a"/>
  
</svg>
