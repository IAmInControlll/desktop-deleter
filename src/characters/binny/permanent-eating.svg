<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -24 184 184" width="160" height="160">
  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.4s infinite; }
    .lid { transform-box: fill-box; transform-origin: 0% 100%; }
    .sweat { animation: sweat 1.4s ease-in infinite; }
    .fly { transform-box: fill-box; transform-origin: center; }
    .f1 { animation: buzz1 1.1s linear infinite; }
    .f2 { animation: buzz2 .9s linear infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes sweat { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
    @keyframes buzz1 { 0% { transform: translate(0,0); } 25% { transform: translate(9px,-5px); } 50% { transform: translate(2px,-10px); } 75% { transform: translate(-7px,-4px); } 100% { transform: translate(0,0); } }
    .fl { transform-box: fill-box; transform-origin: 50% 100%; }
    .fa { animation: flick .45s ease-in-out infinite alternate; }
    .fb { animation: flick .38s ease-in-out .1s infinite alternate-reverse; }
    .fc { animation: flick .52s ease-in-out .2s infinite alternate; }
    .ember { opacity: 0; }
    .e1 { animation: rise 1.1s ease-out infinite; }
    .e2 { animation: rise 1.1s ease-out .35s infinite; }
    .e3 { animation: rise 1.1s ease-out .7s infinite; }
    @keyframes flick { from { transform: scale(1, 1) skewX(0); } to { transform: scale(.92, 1.14) skewX(4deg); } }
    @keyframes rise { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-36px); } }
    @keyframes buzz2 { 0% { transform: translate(0,0); } 25% { transform: translate(-8px,4px); } 50% { transform: translate(-3px,9px); } 75% { transform: translate(6px,3px); } 100% { transform: translate(0,0); } }
    .g { transform-box: fill-box; transform-origin: 50% 100%; animation: squash .3s ease-in-out infinite alternate; }
    .lid { animation: flap .3s ease-in-out infinite alternate; }
    .chew { transform-box: fill-box; transform-origin: center; animation: chew .3s ease-in-out infinite alternate; }
    .bit { opacity: 0; }
    .b1 { animation: fall .9s ease-in infinite; }
    .b2 { animation: fall .9s ease-in .3s infinite; }
    .b3 { animation: fall .9s ease-in .6s infinite; }
    @keyframes squash { from { transform: scale(1.03, .97); } to { transform: scale(.98, 1.02); } }
    @keyframes flap { from { transform: rotate(0); } to { transform: rotate(-38deg); } }
    @keyframes chew { from { transform: scaleY(1); } to { transform: scaleY(.2); } }
    @keyframes fall { 0% { opacity: 1; transform: translateY(-34px) rotate(0); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(0) rotate(160deg); } }
  </style>
  <defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9541a"/><stop offset=".35" stop-color="#ff9a4d"/><stop offset="1" stop-color="#b33a0c"/></linearGradient></defs>
  <ellipse cx="80" cy="153" rx="42" ry="5" fill="#000" opacity=".18"/>
  
  <g class="g">
    <ellipse cx="62" cy="149" rx="9" ry="5" fill="#7a2208"/><ellipse cx="98" cy="149" rx="9" ry="5" fill="#7a2208"/>
    <path d="M42 62 L118 62 L112 140 Q111 147 104 147 L56 147 Q49 147 48 140 Z" fill="url(#metal)" stroke="#7a2208" stroke-width="3" stroke-linejoin="round"/>
    <path d="M53 74 L56 136 M107 74 L104 136" stroke="#7a2208" stroke-width="3" stroke-linecap="round" opacity=".3"/>
    <rect x="36" y="56" width="88" height="10" rx="5" fill="#ff9d5c" stroke="#7a2208" stroke-width="3"/>
    
    <g class="flames">
    <path class="fl fa" d="M30 60 C22 46 30 34 26 18 C40 30 46 44 44 60 Z" fill="#ff6a1a"/>
    <path class="fl fb" d="M116 60 C114 44 122 32 134 20 C132 36 140 46 130 60 Z" fill="#ff6a1a"/>
    <path class="fl fc" d="M44 60 C36 40 50 26 52 4 C64 22 72 38 66 60 Z" fill="#ff7a1a"/>
    <path class="fl fa" d="M92 60 C86 38 100 22 110 2 C116 24 124 40 116 60 Z" fill="#ff7a1a"/>
    <path class="fl fb" d="M64 60 C58 36 72 18 80 -4 C90 18 100 36 96 60 Z" fill="#ff8c1a"/>
    <path class="fl fc" d="M70 60 C66 44 76 32 80 20 C86 32 92 44 90 60 Z" fill="#ffd84a"/>
    <path class="fl fa" d="M50 60 C46 50 52 42 54 34 C60 42 62 50 60 60 Z" fill="#ffd84a"/>
    <path class="fl fb" d="M100 60 C98 50 104 42 108 34 C112 44 114 52 110 60 Z" fill="#ffd84a"/>
  </g>
    <g transform="translate(0 -12) rotate(0 80 51)"><g class="lid">
      <path d="M40 48 Q80 30 120 48 Z" fill="#ff9d5c" stroke="#7a2208" stroke-width="3" stroke-linejoin="round"/>
      <rect x="72" y="33" width="16" height="6" rx="3" fill="#ff9d5c" stroke="#7a2208" stroke-width="2.5"/>
      <rect x="34" y="46" width="92" height="10" rx="5" fill="#ff9d5c" stroke="#7a2208" stroke-width="3"/>
    </g></g>
    <path d="M57 96 Q66 85 75 96" fill="none" stroke="#173b2e" stroke-width="4" stroke-linecap="round"/><path d="M85 96 Q94 85 103 96" fill="none" stroke="#173b2e" stroke-width="4" stroke-linecap="round"/><ellipse class="chew" cx="80" cy="118" rx="10" ry="7" fill="#173b2e"/><ellipse cx="55" cy="107" rx="6" ry="3.5" fill="#ff8fb1" opacity="0.7"/><ellipse cx="105" cy="107" rx="6" ry="3.5" fill="#ff8fb1" opacity="0.7"/>
  </g>
  <g fill="#f6f5ef" stroke="#a9a89c" stroke-width="1.2">
    <rect class="bit b1" x="70" y="40" width="8" height="9" rx="1.5"/>
    <rect class="bit b2" x="84" y="38" width="7" height="8" rx="1.5"/>
    <circle class="bit b3" cx="78" cy="42" r="4"/>
  </g>
  <g fill="#ffb347"><circle class="ember e1" cx="66" cy="20" r="2.5"/><circle class="ember e2" cx="92" cy="14" r="2"/><circle class="ember e3" cx="80" cy="24" r="2.5"/></g>
  
</svg>
