    <path class="fl fa" d="M50 60 C46 50 52 42 54 34 C60 42 62 50 60 60 Z" fill="#ffd84a"/>
    <path class="fl fb" d="M100 60 C98 50 104 42 108 34 C112 44 114 52 110 60 Z" fill="#ffd84a"/>
  </g>
    <g transform="translate(0 -12) rotate(0 80 51)"><g class="lid">
      <path d="M40 48 Q80 30 120 48 Z" fill="#ff9d5c" stroke="#7a2208" stroke-width="3" stroke-linejoin="round"/>
      <rect x="72" y="33" width="16" height="6" rx="3" fill="#ff9d5c" stroke="#7a2208" stroke-width="2.5"/>
      <rect x="34" y="46" width="92" height="10" rx="5" fill="#ff9d5c" stroke="#7a2208" stroke-width="3"/>
    </g></g>
    <g class="eye"><ellipse cx="66" cy="94" rx="9" ry="10" fill="#fff"/><circle cx="67.5" cy="96" r="4.5" fill="#173b2e"/><circle cx="69" cy="94" r="1.5" fill="#fff"/></g><g class="eye"><ellipse cx="94" cy="94" rx="9" ry="10" fill="#fff"/><circle cx="95.5" cy="96" r="4.5" fill="#173b2e"/><circle cx="97" cy="94" r="1.5" fill="#fff"/></g><path d="M56 80 L75 86 M104 80 L85 86" stroke="#173b2e" stroke-width="4" stroke-linecap="round"/><path d="M70 114 Q80 123 90 114" fill="none" stroke="#173b2e" stroke-width="3.5" stroke-linecap="round"/>
